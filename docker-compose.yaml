services:
  open-webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG-main}
    container_name: open-webui
    volumes:
      - open-webui:/app/backend/data
    ports:
      - ${OPEN_WEBUI_PORT-3000}:8080
    environment:
      - 'OPENAI_API_KEY=${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}'
      - 'WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?set WEBUI_SECRET_KEY in .env}'
      - 'WEBUI_NAME=Idilio Chat'
      - 'ENABLE_GOOGLE_DRIVE_INTEGRATION=${ENABLE_GOOGLE_DRIVE_INTEGRATION-False}'
      - 'GOOGLE_DRIVE_CLIENT_ID=${GOOGLE_DRIVE_CLIENT_ID-}'
      - 'GOOGLE_DRIVE_API_KEY=${GOOGLE_DRIVE_API_KEY-}'
      - 'REDSHIFT_URL=${REDSHIFT_URL-}'
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

  idilio-dashboard-sync:
    image: python:3.11-slim
    container_name: idilio-dashboard-sync
    working_dir: /app
    volumes:
      # Bind-mount the containing directory, not the single .py file --
      # single-file bind mounts break when the host file gets rewritten
      # (new inode), which a plain editor save does.
      - ./idilio-analytics/openwebui:/app:ro
      - ${IDILIO_DASHBOARD_PATH:?set IDILIO_DASHBOARD_PATH in .env to an absolute path -- a relative default is ambiguous once this repo is checked out into a worktree}:/mnt/idilio-dashboard:ro
    environment:
      - 'OPENWEBUI_BASE_URL=http://open-webui:8080'
      - 'DEPLOY_ADMIN_EMAIL=${DEPLOY_ADMIN_EMAIL:?set DEPLOY_ADMIN_EMAIL in .env}'
      - 'DEPLOY_ADMIN_PASSWORD=${DEPLOY_ADMIN_PASSWORD:?set DEPLOY_ADMIN_PASSWORD in .env}'
      - 'MOUNT_PATH=/mnt/idilio-dashboard'
      - 'SYNC_INTERVAL_SECONDS=${IDILIO_DASHBOARD_SYNC_INTERVAL_SECONDS-3600}'
    command: sh -c "pip install --quiet --no-cache-dir requests && python3 sync_dashboard_knowledge.py"
    depends_on:
      open-webui:
        condition: service_healthy
    restart: unless-stopped

volumes:
  open-webui: {}
